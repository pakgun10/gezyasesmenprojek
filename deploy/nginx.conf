# Blok nginx untuk Penilaian Projek (dipasang di dalam blok server domain VPS)
# Contoh domain: nilai.gezytech.web.id — sesuaikan dengan domain Pak Gun.

location / {
    proxy_pass http://127.0.0.1:3023;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Batasi ukuran upload (foto produk): sinkron dengan batas aplikasi 8 MB/file.
client_max_body_size 32m;
